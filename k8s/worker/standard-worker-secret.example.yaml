apiVersion: v1
kind: Secret
metadata:
  name: humanthread-worker-runtime
  namespace: humanthread
type: Opaque
stringData:
  HT_WORKER_POOL_TOKEN: replace-with-user-owned-pool-token
  HT_GIT_USERNAME: replace-with-git-username
  HT_GIT_TOKEN: replace-with-git-token
  GIT_AUTHOR_NAME: HumanThread Worker
  GIT_AUTHOR_EMAIL: worker@example.invalid
