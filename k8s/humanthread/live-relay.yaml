apiVersion: apps/v1
kind: Deployment
metadata:
  name: humanthread-live-relay
  namespace: humanthread
  labels:
    app: humanthread
    component: live-relay
spec:
  replicas: 1
  selector:
    matchLabels:
      app: humanthread
      component: live-relay
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: humanthread
        component: live-relay
    spec:
      imagePullSecrets:
        - name: registry-credentials
      containers:
        - name: live-relay
          image: __IMAGE__
          imagePullPolicy: IfNotPresent
          command: ["node", "apps/live-relay/dist/index.js"]
          ports:
            - name: relay
              containerPort: 3101
          env:
            - name: NODE_ENV
              value: production
            - name: HUMANTHREAD_LIVE_RELAY_PORT
              value: "3101"
            # The relay verifies short-lived LiveSession tickets with the same
            # HMAC secret the control plane signs them with; without it the
            # process refuses to start (fail closed).
            - name: HUMANTHREAD_DESKTOP_SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: humanthread-secrets
                  key: HUMANTHREAD_DESKTOP_SESSION_SECRET
          readinessProbe:
            httpGet:
              path: /healthz
              port: relay
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: relay
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 1, memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1001
            runAsGroup: 1001
---
apiVersion: v1
kind: Service
metadata:
  name: humanthread-live-relay
  namespace: humanthread
  labels:
    app: humanthread
    component: live-relay
spec:
  type: ClusterIP
  selector:
    app: humanthread
    component: live-relay
  ports:
    - name: relay
      port: 3101
      targetPort: relay
