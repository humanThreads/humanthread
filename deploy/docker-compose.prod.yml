services:
  web:
    image: ${HUMANTHREAD_IMAGE:?HUMANTHREAD_IMAGE is required}
    container_name: humanthread-web
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      HOSTNAME: 0.0.0.0
      PORT: "3000"
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      HUMANTHREAD_BINDING_CODE_SECRET: ${HUMANTHREAD_BINDING_CODE_SECRET:?HUMANTHREAD_BINDING_CODE_SECRET is required}
      HUMANTHREAD_WEB_SESSION_SECRET: ${HUMANTHREAD_WEB_SESSION_SECRET:?HUMANTHREAD_WEB_SESSION_SECRET is required}
      HUMANTHREAD_DESKTOP_SESSION_SECRET: ${HUMANTHREAD_DESKTOP_SESSION_SECRET:?HUMANTHREAD_DESKTOP_SESSION_SECRET is required}
      HUMANTHREAD_WORKER_POOL_TOKEN_ENCRYPTION_KEY: ${HUMANTHREAD_WORKER_POOL_TOKEN_ENCRYPTION_KEY:?HUMANTHREAD_WORKER_POOL_TOKEN_ENCRYPTION_KEY is required}
      HUMANTHREAD_WORKER_MODEL_SITE_ENCRYPTION_KEY: ${HUMANTHREAD_WORKER_MODEL_SITE_ENCRYPTION_KEY:?HUMANTHREAD_WORKER_MODEL_SITE_ENCRYPTION_KEY is required}
      HUMANTHREAD_PROJECT_ENVIRONMENT_SECRET_ENCRYPTION_KEY: ${HUMANTHREAD_PROJECT_ENVIRONMENT_SECRET_ENCRYPTION_KEY:?HUMANTHREAD_PROJECT_ENVIRONMENT_SECRET_ENCRYPTION_KEY is required}
      HUMANTHREAD_PRIVATE_GIT_HOST_ALLOWLIST: ${HUMANTHREAD_PRIVATE_GIT_HOST_ALLOWLIST:-}
      HUMANTHREAD_INITIAL_USER_PASSWORD: ${HUMANTHREAD_INITIAL_USER_PASSWORD:-}
      HUMANTHREAD_SITE_BASE_URL: ${HUMANTHREAD_SITE_BASE_URL:-}
      HUMANTHREAD_OSS_ENDPOINT: ${HUMANTHREAD_OSS_ENDPOINT:?HUMANTHREAD_OSS_ENDPOINT is required}
      HUMANTHREAD_OSS_REGION: ${HUMANTHREAD_OSS_REGION:?HUMANTHREAD_OSS_REGION is required}
      HUMANTHREAD_OSS_BUCKET: ${HUMANTHREAD_OSS_BUCKET:?HUMANTHREAD_OSS_BUCKET is required}
      HUMANTHREAD_OSS_ACCESS_KEY_ID: ${HUMANTHREAD_OSS_ACCESS_KEY_ID:?HUMANTHREAD_OSS_ACCESS_KEY_ID is required}
      HUMANTHREAD_OSS_ACCESS_KEY_SECRET: ${HUMANTHREAD_OSS_ACCESS_KEY_SECRET:?HUMANTHREAD_OSS_ACCESS_KEY_SECRET is required}
      HUMANTHREAD_OSS_DOWNLOAD_TTL_SECONDS: ${HUMANTHREAD_OSS_DOWNLOAD_TTL_SECONDS:-60}
      HUMANTHREAD_DOWNLOAD_RATE_LIMIT_MAX: ${HUMANTHREAD_DOWNLOAD_RATE_LIMIT_MAX:-5}
      HUMANTHREAD_DOWNLOAD_RATE_LIMIT_WINDOW_SECONDS: ${HUMANTHREAD_DOWNLOAD_RATE_LIMIT_WINDOW_SECONDS:-60}
      HUMANTHREAD_DEVELOPMENT_MODES: ${HUMANTHREAD_DEVELOPMENT_MODES:-true}
      HUMANTHREAD_SMTP_HOST: ${HUMANTHREAD_SMTP_HOST:?HUMANTHREAD_SMTP_HOST is required}
      HUMANTHREAD_SMTP_PORT: ${HUMANTHREAD_SMTP_PORT:?HUMANTHREAD_SMTP_PORT is required}
      HUMANTHREAD_SMTP_USERNAME: ${HUMANTHREAD_SMTP_USERNAME:?HUMANTHREAD_SMTP_USERNAME is required}
      HUMANTHREAD_SMTP_PASSWORD: ${HUMANTHREAD_SMTP_PASSWORD:?HUMANTHREAD_SMTP_PASSWORD is required}
      HUMANTHREAD_REDIS_HOST: ${HUMANTHREAD_REDIS_HOST:-}
      HUMANTHREAD_REDIS_PORT: ${HUMANTHREAD_REDIS_PORT:-}
      HUMANTHREAD_REDIS_PASSWORD: ${HUMANTHREAD_REDIS_PASSWORD:-}
      HUMANTHREAD_REDIS_DB: ${HUMANTHREAD_REDIS_DB:-}
      HUMANTHREAD_REDIS_URL: ${HUMANTHREAD_REDIS_URL:-}
      HUMANTHREAD_ORCHESTRATION_POLL_MS: ${HUMANTHREAD_ORCHESTRATION_POLL_MS:-1000}
      HUMANTHREAD_ORCHESTRATION_DISPATCH: ${HUMANTHREAD_ORCHESTRATION_DISPATCH:-false}
      HUMANTHREAD_ORCHESTRATION_LOOP: ${HUMANTHREAD_ORCHESTRATION_LOOP:-false}
      HUMANTHREAD_ORCHESTRATION_SCHEDULED_TASKS: ${HUMANTHREAD_ORCHESTRATION_SCHEDULED_TASKS:-false}
      HUMANTHREAD_USER_TASKS_READS: ${HUMANTHREAD_USER_TASKS_READS:-false}
      HUMANTHREAD_USER_TASKS_WRITES: ${HUMANTHREAD_USER_TASKS_WRITES:-false}
      HUMANTHREAD_LOOP_GRAPH_V1: ${HUMANTHREAD_LOOP_GRAPH_V1:-false}
      HUMANTHREAD_LOOP_FAILURE_SHADOW: ${HUMANTHREAD_LOOP_FAILURE_SHADOW:-true}
      HUMANTHREAD_LOOP_FAILURE_ENFORCED: ${HUMANTHREAD_LOOP_FAILURE_ENFORCED:-false}
      HUMANTHREAD_LOOP_MOBILE_SOURCE_INTERVENTION: ${HUMANTHREAD_LOOP_MOBILE_SOURCE_INTERVENTION:-true}
      HUMANTHREAD_KNOWLEDGE_INDEXER_URL: ${HUMANTHREAD_KNOWLEDGE_INDEXER_URL:-http://knowledge-indexer:3100}
      HUMANTHREAD_KNOWLEDGE_INDEXER_TOKEN: ${HUMANTHREAD_KNOWLEDGE_INDEXER_TOKEN:-}
      HUMANTHREAD_KNOWLEDGE_EMBEDDING_PROFILE_ID: ${HUMANTHREAD_KNOWLEDGE_EMBEDDING_PROFILE_ID:-}
      HUMANTHREAD_KNOWLEDGE_TEMPLATE_VERSION_ID: ${HUMANTHREAD_KNOWLEDGE_TEMPLATE_VERSION_ID:-}
    volumes:
      - /data/humanthread/uploads:/app/apps/web/public/uploads
      - /data/humanthread/downloads:/app/apps/web/public/downloads
      - /data/apps/storage:/app/apps/web/storage/document-attachments
      - /data/humanthread/task-attachments:/app/apps/web/storage/task-attachments
      - /data/humanthread/loop-review-artifacts:/app/apps/web/storage/loop-review-artifacts
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
  orchestration-worker:
    image: ${HUMANTHREAD_IMAGE:?HUMANTHREAD_IMAGE is required}
    container_name: humanthread-orchestration-worker
    restart: unless-stopped
    init: true
    command: ["node", "apps/orchestration-worker/dist/index.js"]
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      HUMANTHREAD_ORCHESTRATION_POLL_MS: ${HUMANTHREAD_ORCHESTRATION_POLL_MS:-1000}
      HUMANTHREAD_ORCHESTRATION_DISPATCH: ${HUMANTHREAD_ORCHESTRATION_DISPATCH:-false}
      HUMANTHREAD_ORCHESTRATION_LOOP: ${HUMANTHREAD_ORCHESTRATION_LOOP:-false}
      HUMANTHREAD_ORCHESTRATION_SCHEDULED_TASKS: ${HUMANTHREAD_ORCHESTRATION_SCHEDULED_TASKS:-false}
      HUMANTHREAD_TASK_REMINDERS: ${HUMANTHREAD_TASK_REMINDERS:-false}
      HUMANTHREAD_PROJECT_ENVIRONMENT_SECRET_ENCRYPTION_KEY: ${HUMANTHREAD_PROJECT_ENVIRONMENT_SECRET_ENCRYPTION_KEY:?HUMANTHREAD_PROJECT_ENVIRONMENT_SECRET_ENCRYPTION_KEY is required}
      HUMANTHREAD_PRIVATE_GIT_HOST_ALLOWLIST: ${HUMANTHREAD_PRIVATE_GIT_HOST_ALLOWLIST:-}
      HUMANTHREAD_KNOWLEDGE_INDEXER_URL: ${HUMANTHREAD_KNOWLEDGE_INDEXER_URL:-http://knowledge-indexer:3100}
      HUMANTHREAD_KNOWLEDGE_INDEXER_TOKEN: ${HUMANTHREAD_KNOWLEDGE_INDEXER_TOKEN:-}
      HUMANTHREAD_KNOWLEDGE_TEMPLATE_VERSION_ID: ${HUMANTHREAD_KNOWLEDGE_TEMPLATE_VERSION_ID:-}
      HUMANTHREAD_LOOP_GRAPH_V1: ${HUMANTHREAD_LOOP_GRAPH_V1:-false}
      HUMANTHREAD_LOOP_FAILURE_SHADOW: ${HUMANTHREAD_LOOP_FAILURE_SHADOW:-true}
      HUMANTHREAD_LOOP_FAILURE_ENFORCED: ${HUMANTHREAD_LOOP_FAILURE_ENFORCED:-false}
      HUMANTHREAD_LOOP_MOBILE_SOURCE_INTERVENTION: ${HUMANTHREAD_LOOP_MOBILE_SOURCE_INTERVENTION:-true}
  live-relay:
    image: ${HUMANTHREAD_IMAGE:?HUMANTHREAD_IMAGE is required}
    container_name: humanthread-live-relay
    restart: unless-stopped
    init: true
    command: ["node", "apps/live-relay/dist/index.js"]
    ports:
      - "127.0.0.1:3101:3101"
    environment:
      NODE_ENV: production
      HUMANTHREAD_LIVE_RELAY_PORT: "3101"
      # Same HMAC secret the control plane signs LiveSession tickets with; the
      # relay refuses to start without it (fail closed).
      HUMANTHREAD_DESKTOP_SESSION_SECRET: ${HUMANTHREAD_DESKTOP_SESSION_SECRET:?HUMANTHREAD_DESKTOP_SESSION_SECRET is required}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:3101/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s
  qdrant:
    image: ${HUMANTHREAD_QDRANT_IMAGE:-qdrant/qdrant:v1.15.5}
    container_name: humanthread-qdrant
    restart: unless-stopped
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    volumes:
      - /data/humanthread/qdrant:/qdrant/storage
    environment:
      QDRANT__SERVICE__HTTP_PORT: "6333"
      QDRANT__SERVICE__GRPC_PORT: "6334"
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 2g
  knowledge-indexer:
    build:
      context: ..
      dockerfile: docker/knowledge-indexer.Dockerfile
    image: ${HUMANTHREAD_KNOWLEDGE_INDEXER_IMAGE:-humanthread-knowledge-indexer:local}
    container_name: humanthread-knowledge-indexer
    restart: unless-stopped
    depends_on:
      qdrant:
        condition: service_healthy
    ports:
      - "127.0.0.1:3100:3100"
    environment:
      NODE_ENV: production
      PORT: "3100"
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      HUMANTHREAD_QDRANT_URL: http://qdrant:6333
      HUMANTHREAD_QDRANT_API_KEY: ${HUMANTHREAD_QDRANT_API_KEY:-}
      HUMANTHREAD_EMBEDDING_PROFILE_ID: ${HUMANTHREAD_KNOWLEDGE_EMBEDDING_PROFILE_ID:?HUMANTHREAD_KNOWLEDGE_EMBEDDING_PROFILE_ID is required}
      HUMANTHREAD_EMBEDDING_PROFILE_KEY: ${HUMANTHREAD_KNOWLEDGE_EMBEDDING_PROFILE_KEY:-bge-small-zh-v1.5-int8}
      HUMANTHREAD_EMBEDDING_MODEL_ID: ${HUMANTHREAD_KNOWLEDGE_EMBEDDING_MODEL_ID:-BAAI/bge-small-zh-v1.5}
      HUMANTHREAD_EMBEDDING_MODEL_REVISION: ${HUMANTHREAD_KNOWLEDGE_EMBEDDING_MODEL_REVISION:-75c43b069aac4d136ba6bc1122f995fedcfd2781}
      HUMANTHREAD_EMBEDDING_MODEL_DIGEST: ${HUMANTHREAD_KNOWLEDGE_EMBEDDING_MODEL_DIGEST:?HUMANTHREAD_KNOWLEDGE_EMBEDDING_MODEL_DIGEST is required}
      HUMANTHREAD_EMBEDDING_MODEL_PATH: /models/bge-small-zh-v1.5
      HUMANTHREAD_EMBEDDING_DIMENSIONS: ${HUMANTHREAD_KNOWLEDGE_EMBEDDING_DIMENSIONS:-512}
      HUMANTHREAD_EMBEDDING_MAX_LENGTH: ${HUMANTHREAD_KNOWLEDGE_EMBEDDING_MAX_LENGTH:-512}
      HUMANTHREAD_EMBEDDING_THREADS: ${HUMANTHREAD_KNOWLEDGE_EMBEDDING_THREADS:-1}
      HUMANTHREAD_EMBEDDING_BATCH_SIZE: ${HUMANTHREAD_KNOWLEDGE_EMBEDDING_BATCH_SIZE:-4}
    volumes:
      - /data/humanthread/models:/models:ro
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 1g
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:3100/health').then(async r=>process.exit(r.ok && (await r.json()).qdrant ? 0 : 1)).catch(()=>process.exit(1))\"",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
