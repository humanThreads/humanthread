<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>HumanThread Web - 账号设置</title><link rel="stylesheet" href="assets/base.css"></head>
<body><div class="app-shell"><header class="topbar"><a class="brand" href="workspace.html"><span class="brand-mark"></span><span>HumanThread Web</span></a><div class="top-actions"><a class="btn" href="settings-companies.html">公司空间</a><a class="btn" href="settings-devices.html">设备管理</a><a class="btn btn-danger" href="login.html">退出登录</a></div></header>
<main class="content"><div class="page-head"><div><h1 class="page-title">账号设置</h1><p class="page-subtitle">当前用户资料与密码。设置页保持工作台风格，不做传统后台菜单堆砌。</p></div></div>

<section class="panel"><div class="panel-head"><h2 class="panel-title">密码</h2></div><div class="panel-body"><div class="composer"><label class="field-row"><span class="field-label">当前密码</span><input class="field" type="password" value="••••••••"></label><label class="field-row"><span class="field-label">新密码</span><input class="field" type="password" value="••••••••"></label><button class="btn btn-primary" data-save-draft>修改密码</button></div></div></section></div></main></div><script src="assets/base.js"></script></body></html>
