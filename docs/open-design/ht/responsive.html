<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>HumanThread Web - Responsive Workbench</title><link rel="stylesheet" href="assets/base.css"></head>
<body><div class="app-shell"><header class="topbar"><a class="brand" href="workspace.html"><span class="brand-mark"></span><span>HumanThread Web</span></a><div class="search"><input value="响应式工作台同一体验" readonly></div><div class="top-actions"><a class="btn btn-primary" href="#">开始任务</a><a class="btn" href="#">创建跟进</a></div></header>
<main class="content"><div class="page-head"><div><h1 class="page-title">Responsive Web 工作台</h1><p class="page-subtitle">同一 Web 产品体验在窄屏、平板、桌面和宽屏下重排：当前任务优先，侧栏信息按空间折叠。</p></div></div>
<div class="workbench"><section class="canvas"><div class="task-card"><div class="status-line"><span class="pill pill-blue">当前任务</span><span class="help">整理里程碑</span></div><h3>保持任务推进上下文不丢失</h3><div class="task-actions"><button class="btn btn-primary">完成任务</button><button class="btn">转交</button><button class="btn btn-danger">阻塞</button></div></div><div class="panel"><div class="panel-head"><h2 class="panel-title">项目任务</h2></div><div class="list"><div class="row"><div><p class="title">依赖图更新</p><div class="meta">刘瑶 · 待开始</div></div><span class="pill">待处理</span></div><div class="row"><div><p class="title">评审结论同步</p><div class="meta">张一 · 阻塞</div></div><span class="pill pill-danger">阻塞</span></div></div></div></section><aside class="side-stack"><div class="panel"><div class="panel-head"><h2 class="panel-title">本地 Agent</h2></div><div class="panel-body"><a class="btn" href="#">打开本地 Agent</a></div></div><div class="panel"><div class="panel-head"><h2 class="panel-title">队列</h2></div><div class="panel-body"><div class="mini-item"><strong>3 个待确认转交</strong><span class="help">小屏时移动到任务下方</span></div></div></div></aside></div></main></div></body></html>
