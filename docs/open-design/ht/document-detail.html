<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HumanThread Web - 文档详情</title>
  <link rel="stylesheet" href="assets/base.css">
</head>
<body>
<div class="app-shell">
  <header class="topbar">
    <a class="brand" href="project-detail.html"><span class="brand-mark"></span><span>HumanThread Web</span></a>
    <div class="search"><input value="项目章程.md" aria-label="文档" readonly></div>
    <div class="top-actions">
      <button class="btn btn-primary" data-save-draft>保存</button>
      <a class="btn" href="#">取消</a>
      <a class="btn" href="#">查看历史版本</a>
      <button class="btn" data-copy-text="mcp://humanthread/document/123">复制 MCP 链接</button>
    </div>
  </header>
  <main class="content">
    <div class="page-head">
      <div>
        <h1 class="page-title">项目章程.md</h1>
        <p class="page-subtitle">Markdown 文档查看与编辑。保留版本历史、保存/取消和外部工具链链接。</p>
      </div>
    </div>
    <div class="split">
      <section class="panel">
        <div class="panel-head"><h2 class="panel-title">编辑</h2><span class="badge">Markdown</span></div>
        <div class="panel-body">
          <textarea>## 项目目标
统一项目推进、转交和文档协作流程。

## 当前结论
- 每个任务都要有负责人
- 阻塞项要可见
- 文档和工作流要可互相跳转</textarea>
        </div>
      </section>
      <aside class="stack">
        <div class="panel">
          <div class="panel-head"><h2 class="panel-title">版本</h2></div>
          <div class="panel-body">
            <div class="stack">
              <div class="mini-item"><strong>v14</strong><span class="help">刚保存 · 由陈然更新</span></div>
              <div class="mini-item"><strong>v13</strong><span class="help">昨日 · 添加工作流链接</span></div>
            </div>
          </div>
        </div>
        <div class="panel">
          <div class="panel-head"><h2 class="panel-title">动作</h2></div>
          <div class="panel-body">
            <div class="stack">
              <div class="mini-item"><strong>编辑</strong><span class="help">进入可修改状态</span></div>
              <div class="mini-item"><strong>查看历史版本</strong><span class="help">快速回退</span></div>
              <div class="mini-item"><strong>复制 MCP 链接</strong><span class="help">发给 Codex 或其他工具</span></div>
            </div>
          </div>
        </div>
      </aside>
    </div>
  </main>
</div>
<script src="assets/base.js"></script>
</body>
</html>
