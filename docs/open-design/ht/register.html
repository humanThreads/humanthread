<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HumanThread Web - 注册</title>
  <link rel="stylesheet" href="assets/base.css">
</head>
<body>
<div class="app-shell">
  <main class="content">
    <div class="hero" style="min-height: calc(100vh - 48px); align-items:center;">
      <div class="hero-copy">
        <a class="brand" href="landing.html"><span class="brand-mark"></span><span>HumanThread Web</span></a>
        <h1 style="margin-top:18px;">开放注册并创建个人空间。</h1>
        <p>注册页强调个人空间、默认公司选择和创建后直接进入工作台。语义上更像生产入口，不做营销页式叙述。</p>
      </div>
      <div class="panel">
        <div class="panel-head"><h2 class="panel-title">创建账号</h2><span class="badge">个人空间</span></div>
        <div class="panel-body">
          <div class="composer">
            <label class="field-row"><span class="field-label">昵称</span><input class="field" value="陈然"></label>
            <label class="field-row"><span class="field-label">邮箱</span><input class="field" value="chenran@company.com"></label>
            <label class="field-row"><span class="field-label">默认公司</span><select class="field"><option>华南事业部</option><option>产品中台</option></select></label>
            <label class="field-row"><span class="field-label">密码</span><input class="field" type="password" value="••••••••"></label>
            <div class="dock">
              <a class="btn btn-primary" href="workspace.html">注册并进入工作台</a>
              <a class="btn" href="login.html">返回登录</a>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>
</div>
</body>
</html>
