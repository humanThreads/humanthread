<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HumanThread Web - 登录</title>
  <link rel="stylesheet" href="assets/base.css">
</head>
<body>
<div class="app-shell">
  <main class="content">
    <div class="hero" style="min-height: calc(100vh - 48px); align-items:center;">
      <div class="hero-copy">
        <a class="brand" href="landing.html"><span class="brand-mark"></span><span>HumanThread Web</span></a>
        <h1 style="margin-top:18px;">登录并进入你的项目工作台。</h1>
        <p>为企业员工设计的入口页，强调低摩擦登录、账号创建和忘记密码路径，同时保留产品介绍入口。</p>
        <div class="actions" style="margin-top:20px;">
          <a class="btn" href="landing.html">查看产品介绍</a>
          <a class="btn" href="register.html">创建账号</a>
        </div>
      </div>
      <div class="panel">
        <div class="panel-head"><h2 class="panel-title">登录</h2><span class="badge">外部入口</span></div>
        <div class="panel-body">
          <div class="composer">
            <label class="field-row"><span class="field-label">邮箱</span><input class="field" type="email" value="employee@company.com"></label>
            <label class="field-row"><span class="field-label">密码</span><input class="field" type="password" value="••••••••"></label>
            <div class="dock">
              <a class="btn btn-primary" href="workspace.html">登录并进入工作台</a>
              <a class="btn" href="register.html">创建账号</a>
              <a class="btn btn-ghost" href="#">忘记密码</a>
            </div>
          </div>
          <div class="callout" style="margin-top:14px;">
            <strong>产品介绍</strong>
            登录前也能看到项目推进、转交、文档编辑和本地 Agent 的整体路径。
          </div>
        </div>
      </div>
    </div>
  </main>
</div>
</body>
</html>
